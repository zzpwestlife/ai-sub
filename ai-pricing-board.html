<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 订阅价格管理看板</title>
<style>
:root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --green:#22c55e; --red:#ef4444; --yellow:#eab308; --orange:#f97316; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:16px; }
h1 { font-size:1.5rem; color:var(--accent); }
h2 { font-size:1.2rem; margin-bottom:12px; color:var(--accent); }
h3 { font-size:1rem; margin:12px 0 8px; color:var(--text); }
.header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
.header-right { display:flex; gap:12px; align-items:center; font-size:.85rem; }
.header-right label { color:var(--muted); }
.header-right input { width:80px; background:var(--card); border:1px solid var(--border); color:var(--text); padding:4px 8px; border-radius:4px; text-align:center; }
.tabs { display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap; }
.tab { padding:8px 16px; background:var(--card); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:.85rem; color:var(--muted); transition:all .2s; }
.tab:hover { border-color:var(--accent); color:var(--text); }
.tab.active { background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600; }
.view { display:none; } .view.active { display:block; }
table { width:100%; border-collapse:collapse; font-size:.82rem; margin-bottom:16px; }
th, td { padding:6px 10px; text-align:left; border-bottom:1px solid var(--border); }
th { background:var(--card); color:var(--accent); font-weight:600; position:sticky; top:0; cursor:pointer; white-space:nowrap; }
th:hover { background:#253347; }
tr:hover { background:rgba(56,189,248,.05); }
.best { color:var(--green); font-weight:700; }
.worst { color:var(--red); }
.tag { display:inline-block; padding:1px 6px; border-radius:3px; font-size:.72rem; font-weight:600; }
.tag-official { background:#1e3a5f; color:#60a5fa; }
.tag-third { background:#3b2f1a; color:var(--yellow); }
.tag-best { background:#14532d; color:#4ade80; }
.tag-warn { background:#422006; color:var(--orange); }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
.stat { text-align:center; }
.stat-val { font-size:1.5rem; font-weight:700; color:var(--accent); }
.stat-label { font-size:.75rem; color:var(--muted); }
.filter-bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
.filter-bar select, .filter-bar input { background:var(--card); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:4px; font-size:.82rem; }
.filter-bar input { flex:1; min-width:150px; }
.badge { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
.badge-green { background:var(--green); } .badge-red { background:var(--red); } .badge-yellow { background:var(--yellow); }
.provider-header { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); margin-bottom:8px; }
.vs-official { font-size:.75rem; padding:2px 6px; border-radius:3px; }
.vs-cheap { background:#14532d; color:#4ade80; } .-vs-expensive { background:#422006; color:#fb923c; }
.note { font-size:.75rem; color:var(--muted); margin-top:4px; }
.actions { display:flex; gap:6px; margin:8px 0; }
.btn { padding:6px 14px; border-radius:4px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; font-size:.8rem; }
.btn:hover { border-color:var(--accent); } .btn-primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.sort-arrow { font-size:.65rem; margin-left:2px; }
th.sortable { cursor:pointer; user-select:none; } th.sortable:hover { background:#2a3f55; }
th.sorted-asc::after { content:' ▲'; font-size:.6rem; }
th.sorted-desc::after { content:' ▼'; font-size:.6rem; }
</style>
</head>
<body>

<div class="header">
  <div><h1>AI 订阅价格管理看板</h1><div class="note" id="updateDate"></div></div>
  <div class="header-right">
    <label>汇率 $1=¥<input type="number" id="fxRate" value="7.0" step="0.1" onchange="render()"></label>
    <label>缓存命中率 <input type="number" id="cacheHit" value="90" step="5" min="0" max="100" onchange="render()">%</label>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('overview', this)">📊 综合比价</div>
  <div class="tab" onclick="switchTab('provider', this)">🏢 提供商视图</div>
  <div class="tab" onclick="switchTab('subscription', this)">💳 订阅管理</div>
  <div class="tab" onclick="switchTab('scenario', this)">🎯 场景路由</div>
  <div class="tab" onclick="switchTab('config', this)">⚙️ 配置指南</div>
  <div class="tab" onclick="switchTab('history', this)">📜 变更历史</div>
</div>

<!-- ==================== 综合比价 ==================== -->
<div id="view-overview" class="view active">
  <div class="filter-bar">
    <select id="filterModel" onchange="renderOverview()" style="min-width:180px"><option value="">← 选择模型查看对比</option></select>
    <select id="filterCategory" onchange="renderOverview()"><option value="">全部分类</option></select>
    <select id="filterProvider" onchange="renderOverview()"><option value="">全部提供商</option></select>
  </div>
  <div id="overviewContent"></div>
</div>

<!-- ==================== 提供商视图 ==================== -->
<div id="view-provider" class="view">
  <div id="providerContent"></div>
</div>

<!-- ==================== 订阅管理 ==================== -->
<div id="view-subscription" class="view">
  <div id="subscriptionContent"></div>
</div>

<!-- ==================== 配置指南 ==================== -->
<div id="view-config" class="view">
  <div id="configContent"></div>
</div>

<!-- ==================== 场景路由 ==================== -->
<div id="view-scenario" class="view">
  <div id="scenarioContent"></div>
</div>

<!-- ==================== 变更历史 ==================== -->
<div id="view-history" class="view">
  <div class="filter-bar">
    <select id="histProvider" onchange="renderHistory()"><option value="">全部提供商</option></select>
    <select id="histModel" onchange="renderHistory()"><option value="">全部模型</option></select>
    <span class="note" id="histCount"></span>
  </div>
  <div id="historyContent"></div>
</div>

<script>
// ============================================================
// ★ 数据从 data.json 加载，修改价格只需编辑 data.json ★
// ============================================================

let DATA = null;

fetch('data.json')
  .then(r => r.json())
  .then(data => { DATA = data; init(); })
  .catch(err => {
    document.getElementById('overviewContent').innerHTML = '<div class="card"><h2>⚠️ 数据加载失败</h2><p>请确保 data.json 与 HTML 文件在同一目录，且通过 HTTP 服务器访问。</p></div>';
    console.error('Failed to load data.json:', err);
  });

// ============================================================
// 工具函数
// ============================================================
const fx = () => parseFloat(document.getElementById('fxRate').value) || 7.0;
const hitRate = () => (parseFloat(document.getElementById('cacheHit').value) || 90) / 100;

function effectiveInput(price, official) {
  if (!price) return null;
  const cw = price.cacheWrite, cr = price.cacheRead;
  if (cr != null && cr > 0 && hitRate() > 0) {
    const effCacheRead = cr * hitRate() + price.input * (1 - hitRate());
    return effCacheRead;
  }
  return price.input;
}

function compositePrice(price, official) {
  if (!price) return null;
  const effIn = effectiveInput(price, official);
  if (effIn == null) return price.input * 0.7 + price.output * 0.3;
  return effIn * 0.7 + price.output * 0.3;
}

function vsOfficial(modelId, composite) {
  const off = DATA.officialPrices[modelId];
  if (!off || !composite) return null;
  const offComposite = off.input * 0.7 + off.output * 0.3;
  return composite / offComposite;
}

function fmt(v, d=2) { return v == null ? '—' : v.toFixed(d); }
function fmtPct(v) { return v == null ? '—' : (v * 100).toFixed(0) + '%'; }
function providerName(id) { const p = DATA.providers.find(p=>p.id===id); return p ? p.name : id; }
function modelInfo(id) { return DATA.models.find(m=>m.id===id) || { name:id, category:'?', desc:'' }; }

function copyCmd(id) {
  const el = document.getElementById('cmd-' + id);
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => {
    const btn = el.nextElementSibling;
    const orig = btn.textContent;
    btn.textContent = '已复制!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

function sortTable(key) {
  if (window._sortKey === key) {
    window._sortDir = window._sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    window._sortKey = key;
    window._sortDir = 'asc';
  }
  renderOverview();
}

// ============================================================
// Tab 切换
// ============================================================
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const tab = el || [...document.querySelectorAll('.tab')].find(t => t.getAttribute('onclick')?.includes(`'${name}'`));
  if (tab) tab.classList.add('active');
  document.getElementById('view-' + name).classList.add('active');
  render();
}

// ============================================================
// 综合比价视图
// ============================================================
function renderOverview() {
  const modelFilter = document.getElementById('filterModel').value;
  const catFilter = document.getElementById('filterCategory').value;
  const provFilter = document.getElementById('filterProvider').value;

  // === 最优总览 ===
  let summaryHtml = '<div class="card" style="border-color:var(--accent)"><h2>🏆 最优总览</h2><table><thead><tr><th>模型</th><th>最低提供商</th><th>综合单价</th><th>vs 官方</th></tr></thead><tbody>';
  DATA.models.forEach(m => {
    const entries = DATA.prices.filter(p => p.model === m.id && !p.isPeak);
    if (!entries.length) return;
    const scored = entries.map(e => ({ ...e, composite: compositePrice(e, DATA.officialPrices[m.id]) }));
    scored.sort((a, b) => a.composite - b.composite);
    const best = scored[0];
    const off = DATA.officialPrices[m.id];
    const offComp = off ? off.input * 0.7 + off.output * 0.3 : null;
    const vs = offComp ? (best.composite / offComp * 100).toFixed(0) + '%' : '—';
    const isVeryCheap = offComp && best.composite / offComp < 0.2;
    summaryHtml += `<tr><td><strong>${m.name}</strong></td>`;
    summaryHtml += `<td><span class="tag tag-best">${providerName(best.provider)}</span></td>`;
    summaryHtml += `<td class="best">¥${fmt(best.composite)}</td>`;
    summaryHtml += `<td><span class="vs-official ${isVeryCheap ? 'vs-cheap' : 'vs-expensive'}">${vs}</span></td></tr>`;
  });
  summaryHtml += '</tbody></table></div>';

  // Group by model
  const grouped = {};
  DATA.models.forEach(m => { grouped[m.id] = { ...m, entries: [] }; });

  DATA.prices.forEach(p => {
    if (!grouped[p.model]) return;
    const off = DATA.officialPrices[p.model];
    const comp = compositePrice(p, off);
    const vs = vsOfficial(p.model, comp);
    grouped[p.model].entries.push({ ...p, composite: comp, vsOfficial: vs });
  });

  // Filter
  let modelIds = Object.keys(grouped).filter(id => {
    const m = grouped[id];
    if (modelFilter && m.id !== modelFilter) return false;
    if (catFilter && m.category !== catFilter) return false;
    if (provFilter && !m.entries.some(e => e.provider === provFilter)) return false;
    return true;
  });

  // If no model selected and no filters, only show summary
  if (!modelFilter && !catFilter && !provFilter) {
    document.getElementById('overviewContent').innerHTML = summaryHtml;
    return;
  }

  // Sort by composite price (best first)
  modelIds.sort((a, b) => {
    const bestA = Math.min(...grouped[a].entries.filter(e=>!e.isPeak).map(e => e.composite || Infinity));
    const bestB = Math.min(...grouped[b].entries.filter(e=>!e.isPeak).map(e => e.composite || Infinity));
    return bestA - bestB;
  });

  let html = '';
  const sortKey = window._sortKey || 'composite';
  const sortDir = window._sortDir || 'asc';
  const sortCls = (key) => key === sortKey ? (sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc') : '';

  modelIds.forEach(id => {
    const m = grouped[id];
    const off = DATA.officialPrices[id];
    let entries = m.entries.filter(e => !e.isPeak);
    // Apply sort
    entries.sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (va == null) va = Infinity;
      if (vb == null) vb = Infinity;
      if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
      return sortDir === 'asc' ? va - vb : vb - va;
    });
    const bestComp = Math.min(...entries.map(e => e.composite || Infinity));

    html += `<div class="card"><h3>${m.name} <span class="note">${m.desc}</span></h3>`;
    html += `<table><thead><tr><th>提供商</th>`;
    html += `<th class="sortable ${sortCls('input')}" onclick="sortTable('input')">输入</th>`;
    html += `<th class="sortable ${sortCls('output')}" onclick="sortTable('output')">输出</th>`;
    html += `<th class="sortable ${sortCls('cacheWrite')}" onclick="sortTable('cacheWrite')">缓存写</th>`;
    html += `<th class="sortable ${sortCls('cacheRead')}" onclick="sortTable('cacheRead')">缓存读</th>`;
    html += `<th class="sortable ${sortCls('composite')}" onclick="sortTable('composite')">综合单价</th>`;
    html += `<th class="sortable ${sortCls('vsOfficial')}" onclick="sortTable('vsOfficial')">vs 官方</th>`;
    html += `<th>备注</th></tr></thead><tbody>`;

    // Official price row
    if (off) {
      const offComp = off.input * 0.7 + off.output * 0.9;
      html += `<tr style="opacity:.7"><td><span class="tag tag-official">官方基准</span></td>`;
      html += `<td>${fmt(off.input)}</td><td>${fmt(off.output)}</td><td>${fmt(off.cacheWrite)}</td><td>${fmt(off.cacheRead)}</td>`;
      html += `<td>${fmt(offComp)}</td><td>1.00×</td><td></td></tr>`;
    }

    entries.forEach(e => {
      const isBest = e.composite === bestComp;
      const vsClass = e.vsOfficial != null && e.vsOfficial <= 0.2 ? 'vs-cheap' : 'vs-expensive';
      html += `<tr>`;
      html += `<td>${providerName(e.provider)}${isBest ? ' <span class="tag tag-best">最优</span>' : ''}</td>`;
      html += `<td>${fmt(e.input)}</td><td>${fmt(e.output)}</td><td>${e.cacheWrite != null ? fmt(e.cacheWrite) : '—'}</td><td>${e.cacheRead != null ? fmt(e.cacheRead) : '—'}</td>`;
      html += `<td class="${isBest ? 'best' : ''}">${fmt(e.composite)}</td>`;
      html += `<td><span class="vs-official ${vsClass}">${e.vsOfficial != null ? fmtPct(e.vsOfficial) : '—'}</span></td>`;
      html += `<td class="note">${e.notes || ''}</td></tr>`;
    });

    // Peak price for DeepSeek
    const peakEntries = m.entries.filter(e => e.isPeak);
    peakEntries.forEach(e => {
      html += `<tr style="opacity:.5"><td>${providerName(e.provider)} ⚠️高峰</td>`;
      html += `<td>${fmt(e.input)}</td><td>${fmt(e.output)}</td><td>—</td><td>${e.cacheRead != null ? fmt(e.cacheRead) : '—'}</td>`;
      html += `<td>${fmt(e.composite)}</td><td><span class="vs-official vs-expensive">${e.vsOfficial != null ? fmtPct(e.vsOfficial) : '—'}</span></td>`;
      html += `<td class="note">${e.notes || ''}</td></tr>`;
    });

    html += `</tbody></table></div>`;
  });

  document.getElementById('overviewContent').innerHTML = html + summaryHtml;
}

// ============================================================
// 提供商视图
// ============================================================
function renderProviderView() {
  let html = '';
  DATA.providers.forEach(prov => {
    const entries = DATA.prices.filter(p => p.provider === prov.id);
    if (!entries.length && prov.type === 'third-party') return;

    const typeTag = prov.type === 'official' ? '<span class="tag tag-official">官方</span>' : '<span class="tag tag-third">第三方</span>';
    html += `<div class="card"><div class="provider-header"><div><h2>${prov.name} ${typeTag}</h2><div class="note">${prov.notes}</div></div>`;
    if (prov.url) html += `<a href="${prov.url}" target="_blank" class="btn" style="font-size:.75rem">官网 ↗</a>`;
    html += `</div>`;

    if (prov.type === 'official') {
      // Official: show models with official prices
      html += `<table><thead><tr><th>模型</th><th>输入</th><th>输出</th><th>缓存写</th><th>缓存读</th><th>备注</th></tr></thead><tbody>`;
      DATA.models.forEach(m => {
        const op = DATA.officialPrices[m.id];
        if (!op) return;
        const isForThisProvider = DATA.providers.find(p=>p.id===prov.id);
        // Check if this official provider has this model
        const modelCats = { 'anthropic':'Claude', 'openai':'GPT-5.6', 'xai':'Grok', 'deepseek':'DeepSeek', 'google':'Gemini' };
        if (modelCats[prov.id] && m.category !== modelCats[prov.id]) return;
        if (!modelCats[prov.id] && prov.type === 'official') return;

        html += `<tr><td>${m.name}</td><td>${fmt(op.input)}</td><td>${fmt(op.output)}</td>`;
        html += `<td>${fmt(op.cacheWrite)}</td><td>${fmt(op.cacheRead)}</td>`;
        html += `<td class="note">${op.peakInput ? '峰谷定价' : ''}</td></tr>`;
      });
      html += `</tbody></table>`;
    } else {
      // Third-party: show prices vs official
      html += `<table><thead><tr><th>模型</th><th>输入</th><th>输出</th><th>缓存读</th><th>综合单价</th><th>vs 官方</th><th>备注</th></tr></thead><tbody>`;
      entries.forEach(e => {
        if (e.isPeak) return;
        const off = DATA.officialPrices[e.model];
        const comp = compositePrice(e, off);
        const vs = vsOfficial(e.model, comp);
        const vsClass = vs != null && vs <= 0.2 ? 'vs-cheap' : 'vs-expensive';
        const mi = modelInfo(e.model);
        html += `<tr><td>${mi.name}</td><td>${fmt(e.input)}</td><td>${fmt(e.output)}</td>`;
        html += `<td>${e.cacheRead != null ? fmt(e.cacheRead) : '—'}</td>`;
        html += `<td>${fmt(comp)}</td>`;
        html += `<td><span class="vs-official ${vsClass}">${vs != null ? fmtPct(vs) : '—'}</span></td>`;
        html += `<td class="note">${e.notes || ''}</td></tr>`;
      });
      html += `</tbody></table>`;
    }
    html += `</div>`;
  });
  document.getElementById('providerContent').innerHTML = html;
}

// ============================================================
// 订阅管理视图
// ============================================================
function renderSubscription() {
  let html = '<div class="grid">';
  const totalProviders = DATA.subscriptions.filter(s => s.role !== '停用').length;
  const activeModels = new Set();
  DATA.subscriptions.forEach(s => s.models.forEach(m => activeModels.add(m)));

  html += `<div class="card stat"><div class="stat-val">${totalProviders}</div><div class="stat-label">活跃提供商</div></div>`;
  html += `<div class="card stat"><div class="stat-val">${activeModels.size}</div><div class="stat-label">覆盖模型</div></div>`;
  html += `<div class="card stat"><div class="stat-val">¥${DATA.subscriptions.find(s=>s.provider==='apifun')?.balance || 0}</div><div class="stat-label">apifun 余额</div></div>`;
  html += '</div>';

  html += '<h2>当前订阅</h2><table><thead><tr><th>提供商</th><th>类型</th><th>角色</th><th>余额</th><th>覆盖模型</th><th>备注</th></tr></thead><tbody>';
  DATA.subscriptions.forEach(s => {
    const prov = DATA.providers.find(p => p.id === s.provider);
    const typeTag = prov?.type === 'official' ? '<span class="tag tag-official">官方</span>' : '<span class="tag tag-third">第三方</span>';
    const modelNames = s.models.map(m => modelInfo(m).name).join(', ') || '—';
    const balStr = s.balance != null ? `¥${s.balance}` : (s.currency === 'USD' ? 'Office Key' : '—');
    const rowStyle = s.role === '停用' ? 'style="opacity:.4"' : '';
    html += `<tr ${rowStyle}><td>${prov?.name || s.provider}</td><td>${typeTag}</td><td>${s.role}</td><td>${balStr}</td>`;
    html += `<td class="note">${modelNames}</td><td class="note">${s.notes}</td></tr>`;
  });
  html += '</tbody></table>';

  // Risk warnings
  html += `<div class="card"><h2>⚠️ 风险提示</h2><table><thead><tr><th>风险</th><th>说明</th><th>对策</th></tr></thead><tbody>`;
  html += `<tr><td>号池封禁</td><td class="note">Aiberm/apifun 为第三方号池</td><td>双渠道互备 + 小额高频充值</td></tr>`;
  html += `<tr><td>DeepSeek 价格波动</td><td class="note">实测高峰成本暴涨 121 倍</td><td>大批量锁硅基流动;避开工作日高峰</td></tr>`;
  html += `<tr><td>GPT-5.6 限制</td><td class="note">apifun 仅限 Codex APP/CLI</td><td>禁止生图/外接</td></tr>`;
  html += `<tr><td>汇率波动</td><td class="note">±5% 内不影响结论</td><td>看板顶部可调汇率重算</td></tr>`;
  html += `</tbody></table></div>`;
  document.getElementById('subscriptionContent').innerHTML = html;
}

// ============================================================
// 场景路由视图
// ============================================================
function renderScenario() {
  let html = '<div class="card"><h2>🎯 按场景推荐路由</h2>';
  html += '<table><thead><tr><th>使用场景</th><th>首选模型</th><th>首选提供商</th><th>备选</th><th>理由</th></tr></thead><tbody>';
  DATA.scenarios.forEach(s => {
    const mi = modelInfo(s.model);
    html += `<tr><td><strong>${s.name}</strong></td><td>${mi.name}</td>`;
    html += `<td><span class="tag tag-best">${providerName(s.provider)}</span></td>`;
    html += `<td>${s.backup ? providerName(s.backup) || s.backup : '—'}</td>`;
    html += `<td class="note">${s.reason}</td></tr>`;
  });
  html += '</tbody></table></div>';

  // Budget suggestion
  html += `<div class="card"><h2>💰 预算分配建议 (月 ¥200 为例)</h2>`;
  html += `<table><thead><tr><th>提供商</th><th>分配</th><th>金额</th><th>用途</th></tr></thead><tbody>`;
  html += `<tr><td>apifun</td><td>70%</td><td>¥140</td><td class="note">主力编码: Claude + GPT + Grok + DS Pro</td></tr>`;
  html += `<tr><td>硅基流动</td><td>15%</td><td>¥30</td><td class="note">批量任务: DeepSeek V4 Flash</td></tr>`;
  html += `<tr><td>Aiberm</td><td>15%</td><td>¥30</td><td class="note">备用 + 无缓存调用: Claude 系列</td></tr>`;
  html += `<tr><td>V3 API</td><td>0%</td><td>¥0</td><td class="note">不充值,应急再按需</td></tr>`;
  html += `</tbody></table></div>`;
  document.getElementById('scenarioContent').innerHTML = html;
}

// ============================================================
// 变更历史视图（数据来自 price_history.json，由监控脚本自动记录）
// ============================================================
let HISTORY_DATA = null;

function loadHistory() {
  return fetch('price_history.json')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(h => {
      HISTORY_DATA = h;
      // 填充筛选器（去重）
      const provSel = document.getElementById('histProvider');
      const modelSel = document.getElementById('histModel');
      provSel.innerHTML = '<option value="">全部提供商</option>';
      modelSel.innerHTML = '<option value="">全部模型</option>';
      [...new Set(h.map(e => e.provider))].forEach(p => {
        const o = document.createElement('option'); o.value = p; o.textContent = providerName(p) || p; provSel.appendChild(o);
      });
      [...new Set(h.map(e => e.model))].forEach(m => {
        const mi = modelInfo(m);
        const o = document.createElement('option'); o.value = m; o.textContent = mi.name || m; modelSel.appendChild(o);
      });
      renderHistory();
    })
    .catch(() => {
      document.getElementById('historyContent').innerHTML =
        '<div class="card"><h2>📜 暂无变更历史</h2><p class="note">price_history.json 不存在或为空。价格变更由监控脚本（check_prices.py）自动记录。</p></div>';
    });
}

function renderHistory() {
  if (!HISTORY_DATA) return;
  const pf = document.getElementById('histProvider').value;
  const mf = document.getElementById('histModel').value;
  const FIELD_NAMES = { input:'输入', output:'输出', cacheWrite:'缓存写', cacheRead:'缓存读' };
  let entries = HISTORY_DATA.filter(e => (!pf || e.provider === pf) && (!mf || e.model === mf));
  entries.sort((a, b) => (b.time || '').localeCompare(a.time || ''));
  document.getElementById('histCount').textContent = `共 ${entries.length} 条记录`;
  if (!entries.length) {
    document.getElementById('historyContent').innerHTML = '<div class="card"><p class="note">没有符合条件的记录。</p></div>';
    return;
  }
  let html = '<div class="card"><table><thead><tr><th>时间</th><th>提供商</th><th>模型</th><th>字段</th><th>原价格</th><th>→</th><th>新价格</th><th>备注</th></tr></thead><tbody>';
  entries.forEach(e => {
    const mi = modelInfo(e.model);
    const fromStr = e.from === '-' ? '—' : `¥${e.from}`;
    const toStr = e.to === '-' ? '—' : `¥${e.to}`;
    html += `<tr><td class="note" style="white-space:nowrap">${e.time}</td>`;
    html += `<td>${providerName(e.provider) || e.provider}</td>`;
    html += `<td>${mi.name || e.model}</td>`;
    html += `<td>${FIELD_NAMES[e.field] || e.field}</td>`;
    html += `<td class="note">${fromStr}</td><td class="note">→</td><td class="best">${toStr}</td>`;
    html += `<td class="note">${e.note || ''}</td></tr>`;
  });
  html += '</tbody></table></div>';
  document.getElementById('historyContent').innerHTML = html;
}

// ============================================================
// 初始化
// ============================================================
function renderConfig() {
  let html = '<div class="card"><h2>⚙️ 提供商接入配置</h2><p class="note">所有提供商均通过 base_url + api_key + model 方式接入，是否需要加 /v1 或 /anthropic 视情况而定。</p></div>';
  DATA.providers.forEach(prov => {
    if (!prov.baseUrl) return;
    const typeTag = prov.type === 'official' ? '<span class="tag tag-official">官方</span>' : '<span class="tag tag-third">第三方</span>';
    const sub = DATA.subscriptions.find(s => s.provider === prov.id);
    const statusBadge = sub?.role === '主力' ? '<span class="tag tag-best">主力</span>' : sub?.role === '备用' ? '<span class="tag" style="background:#1e3a5f;color:#60a5fa">备用</span>' : sub?.role === '批量' ? '<span class="tag" style="background:#14532d;color:#4ade80">批量</span>' : sub?.role === '兜底' ? '<span class="tag" style="background:#422006;color:#fb923c">兜底</span>' : sub?.role === '暂停' ? '<span class="tag" style="background:#4a1010;color:#f87171">暂停</span>' : '';
    html += `<div class="card"><div class="provider-header"><div><h2>${prov.name} ${typeTag} ${statusBadge}</h2></div>`;
    if (prov.url) html += `<a href="${prov.url}" target="_blank" class="btn" style="font-size:.75rem">控制台 </a>`;
    html += `</div>`;
    html += `<table><tbody>`;
    html += `<tr><td style="width:100px;color:var(--muted)">Base URL</td><td><code style="color:var(--accent);word-break:break-all">${prov.baseUrl}</code></td></tr>`;
    html += `<tr><td style="color:var(--muted)">API Key</td><td class="note">在上方控制台获取</td></tr>`;
    html += `<tr><td style="color:var(--muted)">覆盖模型</td><td class="note">${sub?.models.map(m => modelInfo(m).name).join('、') || '—'}</td></tr>`;
    html += `<tr><td style="color:var(--muted)">备注</td><td class="note">${prov.notes}</td></tr>`;
    html += `</tbody></table>`;
    // Claude Code example
    if (sub && sub.models.length > 0) {
      const cmd = `ANTHROPIC_BASE_URL=${prov.baseUrl} ANTHROPIC_API_KEY=your_key claude`;
      html += `<div style="margin-top:8px;display:flex;align-items:center;gap:8px"><span class="note"><strong>Claude Code：</strong></span><code id="cmd-${prov.id}" style="background:#0f172a;padding:4px 8px;border-radius:3px;flex:1;font-size:.78rem;word-break:break-all">${cmd}</code><button class="btn btn-primary" style="font-size:.75rem;white-space:nowrap" onclick="copyCmd('${prov.id}')">复制</button></div>`;
    }
    html += `</div>`;
  });
  document.getElementById('configContent').innerHTML = html;
}

function render() {
  renderOverview();
  renderProviderView();
  renderSubscription();
  renderScenario();
  renderConfig();
  if (HISTORY_DATA) renderHistory();
}

function init() {
  if (!DATA) return;
  document.getElementById('updateDate').textContent = `数据基准: ${DATA.updateDate} · 综合单价 = 70%×有效输入 + 30%×输出 · 缓存命中率按 ${document.getElementById('cacheHit').value}% 估算`;

  // Populate model dropdown
  const modelSel = document.getElementById('filterModel');
  DATA.models.forEach(m => { const o = document.createElement('option'); o.value = m.id; o.textContent = m.name; modelSel.appendChild(o); });

  // Populate category filter
  const cats = [...new Set(DATA.models.map(m => m.category))];
  const catSel = document.getElementById('filterCategory');
  cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; catSel.appendChild(o); });

  // Populate provider filter
  const provSel = document.getElementById('filterProvider');
  DATA.providers.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; provSel.appendChild(o); });

  render();
  loadHistory();
}

</script>
