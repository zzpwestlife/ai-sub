<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Riding a Bicycle</title>
<style>
  html, body { margin: 0; height: 100%; background: #fdf4e3; }
  body { display: flex; align-items: center; justify-content: center; }
  .stage { width: min(100vw, 150vh); }
  .stage svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="stage">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A pelican riding a bicycle">
  <title>Pelican riding a bicycle</title>
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaf1"/>
      <stop offset="1" stop-color="#fdf4e3"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e9ef"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b267"/>
      <stop offset="1" stop-color="#f4845f"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbd46d"/>
      <stop offset="1" stop-color="#f6b042"/>
    </linearGradient>
  </defs>

  <style>
    .bob, .wing, .head, .pouch, .sl, .cloud, .hills { transform-box: view-box; }

    .bob { animation: bob .8s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .wing { transform-origin: 298px 192px; animation: flap .8s ease-in-out infinite; animation-delay: -.15s; }
    @keyframes flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(7deg); }
    }

    .head { transform-origin: 320px 150px; animation: nod .8s ease-in-out infinite; animation-delay: -.68s; }
    @keyframes nod {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(2.5deg); }
    }

    .pouch { transform-origin: 345px 130px; animation: sway .8s ease-in-out infinite; animation-delay: -.56s; }
    @keyframes sway {
      0%, 100% { transform: skewX(0deg) scaleY(1); }
      50% { transform: skewX(-5deg) scaleY(1.07); }
    }

    .sl { animation: sl 1s linear infinite; }
    @keyframes sl {
      from { transform: translateX(0); }
      to { transform: translateX(-780px); }
    }

    .cloud { animation: drift 16s linear infinite; }
    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-820px); }
    }

    .hills { animation: hills 10s linear infinite; }
    @keyframes hills {
      from { transform: translateX(0); }
      to { transform: translateX(-300px); }
    }

    @media (max-width: 420px) {
      .sl { stroke-width: 4px; }
    }
  </style>

  <!-- Sky -->
  <rect width="600" height="420" fill="url(#skyG)"/>
  <circle cx="500" cy="85" r="52" fill="#ffd98e" opacity=".3"/>
  <circle cx="500" cy="85" r="34" fill="#ffd98e"/>

  <!-- Clouds -->
  <g class="cloud" style="animation-delay:-4s">
    <g transform="translate(650 70)" fill="#ffffff" opacity=".9">
      <ellipse rx="34" ry="12"/>
      <circle cx="-10" cy="-8" r="13"/>
      <circle cx="10" cy="-12" r="16"/>
    </g>
  </g>
  <g class="cloud" style="animation-duration:22s;animation-delay:-15s">
    <g transform="translate(650 135) scale(.7)" fill="#ffffff" opacity=".85">
      <ellipse rx="34" ry="12"/>
      <circle cx="-10" cy="-8" r="13"/>
      <circle cx="10" cy="-12" r="16"/>
    </g>
  </g>

  <!-- Hills (parallax) -->
  <g class="hills">
    <path d="M0 382 L0 330 Q75 292 150 322 T300 330 Q375 292 450 322 T600 330 Q675 292 750 322 T900 330 L900 382 Z" fill="#bfe3d6"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#8ec7d2" stroke-width="3" stroke-linecap="round" opacity=".7">
    <line class="sl" x1="620" y1="60" x2="690" y2="60" style="animation-duration:1.4s;animation-delay:-.2s"/>
    <line class="sl" x1="620" y1="110" x2="670" y2="110" style="animation-duration:1.1s;animation-delay:-.9s"/>
    <line class="sl" x1="620" y1="160" x2="700" y2="160" style="animation-duration:1.3s;animation-delay:-.5s"/>
    <line class="sl" x1="620" y1="205" x2="660" y2="205" style="animation-duration:1s;animation-delay:-.1s"/>
    <line class="sl" x1="620" y1="250" x2="690" y2="250" style="animation-duration:1.2s;animation-delay:-.7s"/>
    <line class="sl" x1="620" y1="290" x2="655" y2="290" style="animation-duration:.9s;animation-delay:-.4s"/>
    <line class="sl" x1="620" y1="345" x2="680" y2="345" style="animation-duration:1.05s;animation-delay:-.8s"/>
    <line class="sl" x1="620" y1="365" x2="650" y2="365" style="animation-duration:1.25s;animation-delay:-.3s"/>
  </g>

  <!-- Road -->
  <rect x="0" y="382" width="600" height="38" fill="#4a5a68"/>
  <line x1="0" y1="382" x2="600" y2="382" stroke="#3b4854" stroke-width="3"/>
  <line x1="-20" y1="403" x2="620" y2="403" stroke="#fdf0d5" stroke-width="4" stroke-dasharray="40 27">
    <animate attributeName="stroke-dashoffset" from="0" to="402" dur=".8s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="298" cy="386" rx="150" ry="5" fill="#000000" opacity=".2"/>

  <!-- FAR LEG (behind bike) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 290 322" to="360 290 322" dur="1.6s" repeatCount="indefinite"/>
    <line x1="290" y1="322" x2="290" y2="344" stroke="#4d5b67" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path fill="none" stroke="#c9d2db" stroke-width="11" stroke-linecap="round" d="M272 242 L296.1 290.3">
    <animate attributeName="d" dur="1.6s" begin="-0.8s" repeatCount="indefinite"
      values="M272 242 L323.7 257.8;M272 242 L324.6 254.4;M272 242 L323.3 258.9;M272 242 L319.1 268.5;M272 242 L311.3 279.1;M272 242 L301.8 287.1;M272 242 L296.1 290.3;M272 242 L296.7 290;M272 242 L300.6 287.8;M272 242 L306.2 283.8;M272 242 L313 277.1;M272 242 L319.7 266.4;M272 242 L323.7 257.8"/>
  </path>
  <path fill="none" stroke="#d9772f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M296.1 290.3 L290 344">
    <animate attributeName="d" dur="1.6s" begin="-0.8s" repeatCount="indefinite"
      values="M323.7 257.8 L290 300;M324.6 254.4 L301 303;M323.3 258.9 L309.1 311;M319.1 268.5 L312 322;M311.3 279.1 L309.1 333;M301.8 287.1 L301 341.1;M296.1 290.3 L290 344;M296.7 290 L279 341.1;M300.6 287.8 L271 333;M306.2 283.8 L268 322;M313 277.1 L271 311;M319.7 266.4 L279 303;M323.7 257.8 L290 300"/>
  </path>
  <g>
    <animateMotion path="M290 300 A22 22 0 1 1 290 344 A22 22 0 1 1 290 300" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    <rect x="-8" y="-2" width="16" height="4" rx="1.5" fill="#4d5b67"/>
    <path d="M-6 -2 Q-4 -6 3 -5 L17 -6 L13 -3 L19 -2 L13 0 L17 2 L3 1 Q-4 1 -6 -2 Z" fill="#d9772f"/>
  </g>

  <!-- REAR WHEEL -->
  <g transform="translate(175 318)">
    <circle r="64" fill="none" stroke="#2b3a46" stroke-width="8"/>
    <circle r="58.5" fill="none" stroke="#b8c6d1" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".8s" repeatCount="indefinite"/>
      <circle r="64" fill="none" stroke="#415766" stroke-width="3" stroke-dasharray="3 9"/>
      <g stroke="#8fa1ae" stroke-width="1.3">
        <line x1="-57" y1="0" x2="57" y2="0"/>
        <line x1="-57" y1="0" x2="57" y2="0" transform="rotate(30)"/>
        <line x1="-57" y1="0" x2="57" y2="0" transform="rotate(60)"/>
        <line x1="-57" y1="0" x2="57" y2="0" transform="rotate(90)"/>
        <line x1="-57" y1="0" x2="57" y2="0" transform="rotate(120)"/>
        <line x1="-57" y1="0" x2="57" y2="0" transform="rotate(150)"/>
      </g>
      <rect x="-3" y="-61" width="6" height="7" rx="1.5" fill="#e76f51"/>
      <circle r="8" fill="none" stroke="#3d4a57" stroke-width="2.5" stroke-dasharray="1.6 1.2"/>
    </g>
    <circle r="6" fill="#3d4a57"/>
    <circle r="2.2" fill="#e9eef2"/>
  </g>

  <!-- FRONT WHEEL -->
  <g transform="translate(420 318)">
    <circle r="64" fill="none" stroke="#2b3a46" stroke-width="8"/>
    <circle r="58.5" fill="none" stroke="#b8c6d1" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".8s" repeatCount="indefinite"/>
      <circle r="64" fill="none" stroke="#415766" stroke-width="3" stroke-dasharray="3 9"/>
      <g stroke="#8fa1ae" stroke-width="1.3">
        <line x1="-57" y1="0" x2="57" y2="0"/>
        <line x1="-57" y1="0" x2="57" y2="0" transform="rotate(30)"/>
        <line x1="-57" y1="0" x2="57" y2="0" transform="rotate(60)"/>
        <line x1="-57" y1="0" x2="57" y2="0" transform="rotate(90)"/>
        <line x1="-57" y1="0" x2="57" y2="0" transform="rotate(120)"/>
        <line x1="-57" y1="0" x2="57" y2="0" transform="rotate(150)"/>
      </g>
      <rect x="-3" y="-61" width="6" height="7" rx="1.5" fill="#e76f51"/>
    </g>
    <circle r="6" fill="#3d4a57"/>
    <circle r="2.2" fill="#e9eef2"/>
  </g>

  <!-- FRAME -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M175 318 L290 322 L262 262 Z" stroke="#2a9d8f" stroke-width="6"/>
    <path d="M262 262 L385 237 L395 261 L290 322" stroke="#2a9d8f" stroke-width="7"/>
    <line x1="385" y1="237" x2="395" y2="261" stroke="#21867a" stroke-width="10"/>
    <path d="M395 261 L413 302 Q417 312 420 318" stroke="#21867a" stroke-width="5"/>
    <line x1="262" y1="262" x2="255" y2="246" stroke="#9aa8b3" stroke-width="5"/>
    <path d="M385 237 L382 224 L397 220" stroke="#3d4a57" stroke-width="5"/>
    <path d="M397 220 Q395 206 374 207" stroke="#3d4a57" stroke-width="4.5"/>
    <line x1="374" y1="207" x2="364" y2="208" stroke="#e76f51" stroke-width="7"/>
  </g>
  <path d="M234 244 Q250 237 274 242 Q266 250 242 249 Z" fill="#2b3a46"/>
  <circle cx="175" cy="318" r="4" fill="#21867a"/>
  <circle cx="420" cy="318" r="4" fill="#21867a"/>

  <!-- CHAIN -->
  <path d="M290 305 L175 310 A8 8 0 0 0 175 326 L290 339 A17 17 0 0 0 290 305" fill="none" stroke="#5b6873" stroke-width="2.5" stroke-dasharray="3 2">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- CHAINRING + NEAR CRANK -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 290 322" to="360 290 322" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="290" cy="322" r="17" fill="none" stroke="#3d4a57" stroke-width="3.5" stroke-dasharray="2 1.56"/>
    <circle cx="290" cy="322" r="14" fill="#dfe6eb" stroke="#3d4a57" stroke-width="1.5"/>
    <path d="M290 322 L290 309 M290 322 L302.4 318 M290 322 L297.6 332.5 M290 322 L282.4 332.5 M290 322 L277.6 318" stroke="#3d4a57" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="290" y1="322" x2="290" y2="300" stroke="#2b3a46" stroke-width="6" stroke-linecap="round"/>
    <circle cx="290" cy="322" r="4" fill="#e9eef2" stroke="#2b3a46" stroke-width="2"/>
  </g>

  <!-- NEAR LEG -->
  <path fill="none" stroke="#e4eaf0" stroke-width="11" stroke-linecap="round" d="M272 242 L323.7 257.8">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
      values="M272 242 L323.7 257.8;M272 242 L324.6 254.4;M272 242 L323.3 258.9;M272 242 L319.1 268.5;M272 242 L311.3 279.1;M272 242 L301.8 287.1;M272 242 L296.1 290.3;M272 242 L296.7 290;M272 242 L300.6 287.8;M272 242 L306.2 283.8;M272 242 L313 277.1;M272 242 L319.7 266.4;M272 242 L323.7 257.8"/>
  </path>
  <path fill="none" stroke="#f39c4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M323.7 257.8 L290 300">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
      values="M323.7 257.8 L290 300;M324.6 254.4 L301 303;M323.3 258.9 L309.1 311;M319.1 268.5 L312 322;M311.3 279.1 L309.1 333;M301.8 287.1 L301 341.1;M296.1 290.3 L290 344;M296.7 290 L279 341.1;M300.6 287.8 L271 333;M306.2 283.8 L268 322;M313 277.1 L271 311;M319.7 266.4 L279 303;M323.7 257.8 L290 300"/>
  </path>
  <g>
    <animateMotion path="M290 300 A22 22 0 1 1 290 344 A22 22 0 1 1 290 300" dur="1.6s" repeatCount="indefinite"/>
    <rect x="-8" y="-2" width="16" height="4" rx="1.5" fill="#2b3a46"/>
    <path d="M-6 -2 Q-4 -6 3 -5 L17 -6 L13 -3 L19 -2 L13 0 L17 2 L3 1 Q-4 1 -6 -2 Z" fill="#f39c4a"/>
    <path d="M3 -4 L15 -5 M3 -2 L16 -2 M3 0 L14 1" stroke="#d9772f" stroke-width=".8" fill="none"/>
  </g>

  <!-- PELICAN BODY (bobbing) -->
  <g class="bob">
    <!-- Tail -->
    <path d="M222 198 L186 188 L198 202 L182 210 L200 214 L190 224 L224 220 Z" fill="#dfe6ed" stroke="#c5d0da" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Neck -->
    <path d="M296 188 C300 166 314 158 314 134 L344 130 C342 160 344 186 326 216 Z" fill="url(#bodyG)"/>
    <path d="M334 150 C338 172 336 192 326 212" fill="none" stroke="#fdf0c4" stroke-width="4" stroke-linecap="round" opacity=".8"/>

    <!-- Body -->
    <path d="M214 206 C220 178 262 170 302 178 C324 184 334 206 324 226 C314 246 272 253 240 245 C222 240 210 224 214 206 Z" fill="url(#bodyG)" stroke="#d3dce5" stroke-width="1.5"/>
    <g fill="none" stroke="#d3dce5" stroke-width="1.4" stroke-linecap="round">
      <path d="M300 214 q5 5 10 0 M286 226 q5 5 10 0 M300 232 q5 5 10 0 M272 236 q5 5 10 0 M258 232 q5 5 10 0"/>
    </g>

    <!-- Wing -->
    <g class="wing">
      <path d="M298 190 C284 176 244 178 218 196 L194 208 L212 210 L196 220 L216 219 L204 230 L228 226 C258 228 288 220 304 204 Z" fill="#eef2f6" stroke="#c5d0da" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M236 189 C226 191 222 193 218 196 L194 208 L212 210 L196 220 L216 219 L204 230 L228 226 L240 223 C232 214 231 200 236 189 Z" fill="#34495e"/>
      <path d="M290 196 C270 196 256 204 246 214 M280 190 C262 192 250 198 242 206 M296 204 C276 210 262 216 250 222" fill="none" stroke="#c5d0da" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M284 184 q4 4 8 0 M274 186 q4 4 8 0 M264 189 q4 4 8 0" fill="none" stroke="#d3dce5" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Head + beak (trailing) -->
    <g class="head">
      <g class="pouch">
        <path d="M345 128 Q392 131 428 142 Q412 178 372 177 Q348 173 340 146 Z" fill="url(#pouchG)" stroke="#e07a45" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M356 150 Q380 162 404 156 M362 164 Q382 170 398 166" fill="none" stroke="#e8875a" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>
      </g>
      <circle cx="330" cy="120" r="19" fill="#ffffff" stroke="#d3dce5" stroke-width="1.5"/>
      <path d="M314 110 Q306 100 313 91 Q318 101 325 103 Q322 94 330 88 Q333 99 338 103 Z" fill="#fbe7a1"/>
      <circle cx="337" cy="116" r="4.5" fill="#f9c3a8"/>
      <circle cx="337" cy="116" r="2.6" fill="#1f2a36"/>
      <circle cx="338" cy="115" r=".9" fill="#ffffff"/>
      <path d="M343 110 Q392 114 430 132 Q437 138 430 142 Q392 130 344 128 Z" fill="url(#beakG)" stroke="#e39b3a" stroke-width="1" stroke-linejoin="round"/>
      <path d="M427 131 Q439 135 434 147 Q432 141 425 140 Z" fill="#e0703a"/>
      <path d="M350 115 Q392 119 424 133" fill="none" stroke="#fde6a3" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
</div>
</body>
</html>
